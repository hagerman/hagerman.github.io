<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Median FCM Hardware Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: #f1f5f9;
      color: #0f172a;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 1.25rem;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .label {
      font-weight: 700;
      font-size: 0.72rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .mono {
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      word-break: break-all;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px;
      border-radius: 6px;
      min-height: 20px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button {
      background-color: #0f766e;
      color: #ffffff;
      border: none;
      padding: 12px 8px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    button.accent {
      background-color: #2563eb;
    }
    button.secondary {
      background-color: #475569;
    }
    button.copy {
      width: 100%;
      background-color: #1e293b;
      margin-top: 8px;
    }
    #log {
      height: 240px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <h2>Median FCM Diagnostic Harness</h2>

  <div class="card">
    <div class="label">Registration Status</div>
    <div id="status" class="mono">Ready</div>
  </div>

  <div class="card">
    <div class="label">Device Token</div>
    <div id="token" class="mono">(None)</div>
    <button class="copy" onclick="copyToken()">Copy Token</button>
  </div>

  <div class="card btn-grid">
    <button class="accent" onclick="testCheckPermission()">1. Check Permission</button>
    <button class="accent" onclick="testRequestPermission()">2. Request Perm</button>
    <button onclick="testGetTokenPromise()">3. Get Token (Direct)</button>
    <button class="secondary" onclick="testRegisterPromise()">4. Register (Direct)</button>
  </div>

  <div class="card">
    <div class="label">Console Log</div>
    <div id="log" class="mono"></div>
  </div>

  <script>
    function printLog(msg) {
      const el = document.getElementById("log");
      const time = new Date().toLocaleTimeString();
      el.innerText += `[${time}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    }

    function setStatus(text) {
      document.getElementById("status").innerText = text;
    }

    function setToken(val) {
      document.getElementById("token").innerText = val;
      setStatus("Token acquired!");
      printLog(">>> SUCCESS: Device Token received: " + val);
    }

    function getFCM() {
      return (window.median && window.median.firebaseMessaging) ||
             (window.gonative && window.gonative.firebaseMessaging) ||
             null;
    }

    function withTimeout(promise, ms, desc) {
      return Promise.race([
        promise,
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error(`${desc} timed out after ${ms / 1000}s (APNs exchange hang)`)), ms)
        )
      ]);
    }

    // 1. Check Permission Status
    async function testCheckPermission() {
      const fcm = getFCM();
      if (!fcm || !fcm.checkPermission) {
        printLog("Error: checkPermission method not found.");
        return;
      }
      setStatus("Checking permission...");
      printLog("Invoking await fcm.checkPermission()...");
      try {
        const res = await withTimeout(fcm.checkPermission(), 5000, "checkPermission");
        printLog("checkPermission resolved: " + JSON.stringify(res));
        setStatus("Permission: " + (res?.receive || JSON.stringify(res)));
      } catch (err) {
        printLog("checkPermission failed: " + err.message);
        setStatus("Check permission failed");
      }
    }

    // 2. Request Permission Status
    async function testRequestPermission() {
      const fcm = getFCM();
      if (!fcm || !fcm.requestPermission) {
        printLog("Error: requestPermission method not found.");
        return;
      }
      setStatus("Requesting permission...");
      printLog("Invoking await fcm.requestPermission()...");
      try {
        const res = await withTimeout(fcm.requestPermission(), 10000, "requestPermission");
        printLog("requestPermission resolved: " + JSON.stringify(res));
        setStatus("Request result: " + JSON.stringify(res));
      } catch (err) {
        printLog("requestPermission failed: " + err.message);
        setStatus("Request perm failed");
      }
    }

    // 3. Get Token via direct Promise
    async function testGetTokenPromise() {
      const fcm = getFCM();
      if (!fcm || !fcm.getToken) {
        printLog("Error: getToken method not found.");
        return;
      }
      setStatus("Fetching token (awaiting promise)...");
      printLog("Calling await fcm.getToken()...");

      try {
        // Native method expects direct invocation without options object
        const res = await withTimeout(fcm.getToken(), 10000, "fcm.getToken()");
        printLog("getToken resolved: " + JSON.stringify(res));

        const token = (typeof res === "string") ? res : (res?.token || res?.value);
        if (token) {
          setToken(token);
        } else {
          printLog("No token field in payload: " + JSON.stringify(res));
        }
      } catch (err) {
        printLog("getToken rejected: " + err.message);
        setStatus("Token retrieval failed");
      }
    }

    // 4. Register via direct Promise
    async function testRegisterPromise() {
      const fcm = getFCM();
      if (!fcm || !fcm.register) {
        printLog("Error: register method not found.");
        return;
      }
      setStatus("Calling register (awaiting promise)...");
      printLog("Calling await fcm.register()...");

      try {
        const res = await withTimeout(fcm.register(), 10000, "fcm.register()");
        printLog("register resolved: " + JSON.stringify(res));

        const token = (typeof res === "string") ? res : (res?.token || res?.value);
        if (token) {
          setToken(token);
        }
      } catch (err) {
        printLog("register rejected: " + err.message);
        setStatus("Register failed");
      }
    }

    function copyToken() {
      const token = document.getElementById("token").innerText;
      if (!token || token === "(None)") {
        alert("No token to copy");
        return;
      }
      navigator.clipboard.writeText(token).then(() => alert("Copied to clipboard!"));
    }

    // Event hooks
    function initListeners() {
      const fcm = getFCM();
      if (fcm && typeof fcm.addListener === "function") {
        printLog("Registering listener on fcm.addListener...");
        try {
          fcm.addListener("tokenReceived", (info) => {
            printLog("fcm.addListener('tokenReceived'): " + JSON.stringify(info));
            if (info?.token) setToken(info.token);
          });
        } catch (e) {
          printLog("addListener error: " + e.message);
        }
      }

      window.addEventListener("median_firebase_messaging_token", (e) => {
        printLog("Window event median_firebase_messaging_token: " + JSON.stringify(e.detail));
        if (e.detail?.token) setToken(e.detail.token);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      printLog("Diagnostic harness loaded.");
      setTimeout(initListeners, 300);
    });
  </script>
</body>
</html>
