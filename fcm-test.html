<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Median Bridge & Transport Diagnostic</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background-color: #f1f5f9;
      color: #0f172a;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 1.15rem;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .label {
      font-weight: 700;
      font-size: 0.72rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .mono {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      word-break: break-all;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px;
      border-radius: 6px;
      min-height: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    button {
      background-color: #0f766e;
      color: #ffffff;
      border: none;
      padding: 10px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    button.alt {
      background-color: #2563eb;
    }
    button.dark {
      background-color: #334155;
    }
    #log {
      height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h2>Median Bridge Connectivity Test</h2>

  <div class="card">
    <div class="label">Bridge Status</div>
    <div id="status" class="mono">Ready</div>
  </div>

  <div class="card">
    <div class="label">Device Token / Result</div>
    <div id="token" class="mono">(None)</div>
  </div>

  <div class="card grid">
    <button class="dark" onclick="testPingDeviceInfo()">1. Ping deviceInfo()</button>
    <button class="dark" onclick="testPermissionsStatus()">2. Check Perm Status</button>
    <button class="alt" onclick="testNativeClipboard()">3. Write Clipboard</button>
    <button class="alt" onclick="testFCMDirect()">4. FCM getToken()</button>
    <button onclick="testFCMRegister()">5. FCM register()</button>
    <button onclick="testUriSchemeRegistration()">6. URI Scheme Fallback</button>
  </div>

  <div class="card">
    <div class="label">Activity Log</div>
    <div id="log" class="mono"></div>
  </div>

  <script>
    function log(msg) {
      const el = document.getElementById("log");
      const time = new Date().toLocaleTimeString();
      el.innerText += `[${time}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    }

    function setStatus(text) {
      document.getElementById("status").innerText = text;
    }

    function setResult(val) {
      document.getElementById("token").innerText = val;
      log(">>> Output: " + val);
    }

    function getBridge() {
      return window.median || window.gonative || null;
    }

    function timeout(ms, label) {
      return new Promise((_, reject) =>
        setTimeout(() => reject(new Error(`${label} timed out after ${ms/1000}s`)), ms)
      );
    }

    // 1. General native communication test (deviceInfo)
    async function testPingDeviceInfo() {
      const bridge = getBridge();
      if (!bridge) {
        log("FAIL: window.median / window.gonative not detected");
        return;
      }
      setStatus("Calling deviceInfo()...");
      log("Testing bridge transport with deviceInfo()...");
      try {
        if (typeof bridge.deviceInfo === 'function') {
          const res = await Promise.race([bridge.deviceInfo(), timeout(4000, "deviceInfo")]);
          log("SUCCESS: Native bridge is responsive! Payload: " + JSON.stringify(res));
          setStatus("Bridge Active (deviceInfo OK)");
        } else {
          log("deviceInfo function not exposed on root bridge.");
        }
      } catch (err) {
        log("ERROR calling deviceInfo: " + err.message);
        setStatus("deviceInfo error/timeout");
      }
    }

    // 2. Query permissions status through the native bridge
    async function testPermissionsStatus() {
      const bridge = getBridge();
      if (!bridge || !bridge.permissions || typeof bridge.permissions.status !== 'function') {
        log("bridge.permissions.status() not available.");
        return;
      }
      setStatus("Querying permissions.status()...");
      log("Invoking bridge.permissions.status(['Notifications'])...");
      try {
        const res = await Promise.race([
          bridge.permissions.status(["Notifications"]),
          timeout(4000, "permissions.status")
        ]);
        log("SUCCESS: Permissions returned: " + JSON.stringify(res));
        setStatus("Permissions: " + JSON.stringify(res));
      } catch (err) {
        log("ERROR permissions.status: " + err.message);
        setStatus("permissions.status error/timeout");
      }
    }

    // 3. Test a write command across the bridge
    async function testNativeClipboard() {
      const bridge = getBridge();
      if (!bridge || !bridge.clipboard || typeof bridge.clipboard.set !== 'function') {
        log("bridge.clipboard.set not available.");
        return;
      }
      log("Testing clipboard.set via bridge...");
      try {
        const testStr = "Bridge OK " + new Date().toLocaleTimeString();
        await bridge.clipboard.set({ data: testStr });
        log("SUCCESS: Native clipboard.set executed with: " + testStr);
        setStatus("Clipboard set successfully");
      } catch (err) {
        log("ERROR clipboard: " + err.message);
      }
    }

    // 4. Test FCM getToken directly
    async function testFCMDirect() {
      const bridge = getBridge();
      const fcm = bridge?.firebaseMessaging;
      if (!fcm || typeof fcm.getToken !== 'function') {
        log("fcm.getToken function not found");
        return;
      }
      setStatus("Calling fcm.getToken()...");
      log("Executing await fcm.getToken()...");
      try {
        const res = await Promise.race([fcm.getToken(), timeout(6000, "fcm.getToken")]);
        log("SUCCESS fcm.getToken: " + JSON.stringify(res));
        const token = (typeof res === 'string') ? res : (res?.token || res?.value);
        if (token) setResult(token);
      } catch (err) {
        log("ERROR fcm.getToken: " + err.message);
        setStatus("getToken failed");
      }
    }

    // 5. Test FCM register directly
    async function testFCMRegister() {
      const bridge = getBridge();
      const fcm = bridge?.firebaseMessaging;
      if (!fcm || typeof fcm.register !== 'function') {
        log("fcm.register function not found");
        return;
      }
      setStatus("Calling fcm.register()...");
      log("Executing await fcm.register()...");
      try {
        const res = await Promise.race([fcm.register(), timeout(6000, "fcm.register")]);
        log("SUCCESS fcm.register: " + JSON.stringify(res));
        const token = (typeof res === 'string') ? res : (res?.token || res?.value);
        if (token) setResult(token);
      } catch (err) {
        log("ERROR fcm.register: " + err.message);
        setStatus("register failed");
      }
    }

    // 6. Test native URL scheme invocation (gonative://)
    function testUriSchemeRegistration() {
      log("Triggering gonative:// URL scheme registration call...");
      window.location.href = "gonative://firebaseMessaging/register";
      setTimeout(() => {
        log("Attempted URI redirect. Checking if token arrived via event...");
      }, 1500);
    }

    // Event listener for push tokens delivered asynchronously
    window.addEventListener("median_firebase_messaging_token", (e) => {
      log("Event 'median_firebase_messaging_token' received: " + JSON.stringify(e.detail));
      if (e.detail?.token) setResult(e.detail.token);
    });

    document.addEventListener("DOMContentLoaded", () => {
      log("Diagnostic loaded. UA: " + navigator.userAgent);
    });
  </script>
</body>
</html>
